<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>802 Universe</title>
<meta name="description" content="A tool from the 802 Universe collection.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1141B8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EDF2; --surface:#FFFFFF; --surface-2:#F4F7FA;
  --ink:#0B1220; --ink-2:#33415A; --muted:#66768D;
  --line:#CBD5E1; --line-2:#E2E8F0;
  --cobalt:#1141B8; --cobalt-soft:rgba(17,65,184,.07); --signal:#FF5A1F;
  --grid:rgba(11,18,32,.055);
}
[data-theme="dark"]{
  --paper:#080B10; --surface:#0F141C; --surface-2:#141B25;
  --ink:#E4EBF4; --ink-2:#A9B7C9; --muted:#7C8A9E;
  --line:#232D3B; --line-2:#1A222D;
  --cobalt:#6C9BFF; --cobalt-soft:rgba(108,155,255,.10); --signal:#FF8A4C;
  --grid:rgba(228,235,244,.055);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif; font-size:16px; line-height:1.68;
  -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px;
}
.wrap{width:min(760px,92vw); margin-inline:auto}
.topbar{position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line-2)}
.topbar-in{display:flex; align-items:center; gap:20px; height:62px; width:min(1140px,92vw); margin-inline:auto}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; margin-right:auto}
.brand svg{width:26px; height:26px; color:var(--cobalt)}
.brand b{font-weight:800; letter-spacing:-.03em; font-size:18px}
.brand b span{color:var(--cobalt)}
.back{font-family:'Martian Mono',monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-2); text-decoration:none}
.back:hover{color:var(--cobalt)}
.theme-btn{width:36px; height:36px; display:grid; place-items:center; border:1px solid var(--line);
  border-radius:9px; background:var(--surface); color:var(--ink-2); cursor:pointer}
.theme-btn:hover{color:var(--cobalt); border-color:var(--cobalt)}
.theme-btn svg{width:16px; height:16px}
[data-theme="light"] .icon-sun{display:none}
[data-theme="dark"] .icon-moon{display:none}

.head{padding:66px 0 30px; border-bottom:1px solid var(--line-2)}
.eyebrow{font-family:'Martian Mono',monospace; font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); margin:0 0 14px}
.head h1{font-size:clamp(2rem,4.6vw,3.1rem); font-weight:800; letter-spacing:-.04em;
  line-height:1.03; margin:0 0 16px}
.lede{font-size:1.1rem; color:var(--ink-2); margin:0 0 24px}
.meta{display:flex; gap:8px; flex-wrap:wrap}
.tag{font-family:'Martian Mono',monospace; font-size:8.5px; letter-spacing:.08em;
  color:var(--muted); border:1px solid var(--line-2); padding:4px 8px; border-radius:5px}
.btn{display:inline-flex; align-items:center; gap:9px; text-decoration:none;
  font-family:'Martian Mono',monospace; font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; padding:13px 20px; border-radius:9px;
  border:1px solid var(--cobalt); background:var(--cobalt); color:#fff; margin-top:24px}

.body{padding:44px 0 90px}
.body h2{font-size:1.5rem; font-weight:700; letter-spacing:-.025em; margin:44px 0 14px}
.body h3{font-size:1.13rem; font-weight:600; margin:30px 0 10px}
.body p, .body li{color:var(--ink-2)}
.body a{color:var(--cobalt)}
.body img{max-width:100%; border:1px solid var(--line-2); border-radius:12px}
.body pre{background:var(--surface); border:1px solid var(--line-2); border-radius:10px;
  padding:16px 18px; overflow-x:auto; font-family:'Martian Mono',monospace; font-size:12.5px; line-height:1.6}
.body code{font-family:'Martian Mono',monospace; font-size:.86em}
.body blockquote{margin:24px 0; padding:2px 0 2px 20px; border-left:3px solid var(--cobalt); color:var(--ink-2)}
.body table{width:100%; border-collapse:collapse; margin:22px 0; font-size:.92rem}
.body th, .body td{border:1px solid var(--line-2); padding:9px 12px; text-align:left}
.body th{background:var(--surface-2); font-family:'Martian Mono',monospace; font-size:10px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:500}

.footer{border-top:1px solid var(--line-2); padding:30px 0 46px;
  font-family:'Martian Mono',monospace; font-size:9.5px; letter-spacing:.08em; color:var(--muted)}
.footer a{color:var(--ink-2); text-decoration:none}
.footer a:hover{color:var(--cobalt)}
:focus-visible{outline:2px solid var(--signal); outline-offset:3px; border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<style>
/* tool page additions */
.downloads{display:flex; flex-wrap:wrap; gap:12px; margin-top:26px}
.downloads .btn{margin-top:0}
.btn.ghost{background:transparent; color:var(--cobalt)}
.btn .sz{opacity:.8; font-weight:400}
.state{padding:70px 0; color:var(--muted); font-family:'Martian Mono',monospace; font-size:12px}
.readme-empty{color:var(--muted)}
.body h1{font-size:1.7rem; font-weight:800; letter-spacing:-.03em; margin:40px 0 14px}
</style>

</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x=".8" y=".8" width="30.4" height="30.4" rx="7" stroke="currentColor" stroke-width="1.6"/>
        <path d="M5 22h4l2-10 2 10h4l2-14 2 14h4" stroke="currentColor" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <b>802<span>Universe</span></b>
    </a>
    <a class="back" href="/">&larr; All tools</a>
    <button class="theme-btn" id="themeBtn" aria-label="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="head">
    <div class="wrap">
      <p class="eyebrow" id="tEyebrow">Tool</p>
      <h1 id="tTitle">Loading&hellip;</h1>
      <p class="lede" id="tLede"></p>
      <div class="meta" id="tTags"></div>
      <div class="downloads" id="tDownloads"></div>
    </div>
  </section>

  <section class="body">
    <div class="wrap">
      <div id="tReadme"><p class="state">Loading&hellip;</p></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap">
    <a href="/">802universe.com</a> &nbsp;&middot;&nbsp;
    <a href="mailto:802universe@gmail.com">802universe@gmail.com</a>
  </div>
</footer>

<script>
/* theme (shares the 802u-theme key with the rest of the site) */
const root = document.documentElement, tBtn = document.getElementById('themeBtn');
let saved = null; try { saved = localStorage.getItem('802u-theme'); } catch(e){}
root.setAttribute('data-theme', saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
tBtn.addEventListener('click', () => {
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('802u-theme', next); } catch(e){}
});

/* ---- tiny, safe Markdown renderer (escapes first; only inserts known tags) ---- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function safeUrl(u){u=(u||'').trim(); return /^(https?:|mailto:|#|\/)/i.test(u) ? u.replace(/"/g,'%22') : '#';}
function inline(s){
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,(m,a,u)=>`<img alt="${a}" src="${safeUrl(u)}">`);
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,(m,t,u)=>`<a href="${safeUrl(u)}"${/^https?:/i.test(u)?' target="_blank" rel="noopener"':''}>${t}</a>`);
  s=s.replace(/`([^`]+)`/g,(m,c)=>`<code>${c}</code>`);
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<em>$2</em>');
  return s;
}
function mdToHtml(md){
  const L=String(md||'').replace(/\r\n?/g,'\n').split('\n'); let H='', i=0, para=[];
  const flush=()=>{ if(para.length){ H+='<p>'+inline(esc(para.join(' ')))+'</p>'; para=[]; } };
  const cells=r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>inline(esc(c.trim())));
  while(i<L.length){
    const ln=L[i];
    if(/^```/.test(ln)){ flush(); i++; const c=[]; while(i<L.length && !/^```/.test(L[i])){c.push(L[i]);i++;} i++; H+='<pre><code>'+esc(c.join('\n'))+'</code></pre>'; continue; }
    const h=ln.match(/^(#{1,6})\s+(.*)$/); if(h){ flush(); const lv=Math.min(h[1].length+1,6); H+=`<h${lv}>`+inline(esc(h[2].trim()))+`</h${lv}>`; i++; continue; }
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(ln)){ flush(); H+='<hr>'; i++; continue; }
    if(/^>\s?/.test(ln)){ flush(); const b=[]; while(i<L.length && /^>\s?/.test(L[i])){b.push(L[i].replace(/^>\s?/,''));i++;} H+='<blockquote>'+inline(esc(b.join(' ')))+'</blockquote>'; continue; }
    if(/\|/.test(ln) && i+1<L.length && /-/.test(L[i+1]) && /^\s*\|?[\s:|-]+$/.test(L[i+1])){
      flush(); const head=cells(ln); i+=2; const rows=[];
      while(i<L.length && /\|/.test(L[i]) && L[i].trim()!==''){ rows.push(cells(L[i])); i++; }
      H+='<table><thead><tr>'+head.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table>'; continue;
    }
    if(/^\s*[-*+]\s+/.test(ln)){ flush(); const it=[]; while(i<L.length && /^\s*[-*+]\s+/.test(L[i])){it.push(L[i].replace(/^\s*[-*+]\s+/,''));i++;} H+='<ul>'+it.map(x=>`<li>${inline(esc(x))}</li>`).join('')+'</ul>'; continue; }
    if(/^\s*\d+\.\s+/.test(ln)){ flush(); const it=[]; while(i<L.length && /^\s*\d+\.\s+/.test(L[i])){it.push(L[i].replace(/^\s*\d+\.\s+/,''));i++;} H+='<ol>'+it.map(x=>`<li>${inline(esc(x))}</li>`).join('')+'</ol>'; continue; }
    if(ln.trim()===''){ flush(); i++; continue; }
    para.push(ln.trim()); i++;
  }
  flush(); return H;
}

/* ---- helpers ---- */
const slug = (location.pathname.replace(/^\/+|\/+$/g,'').split('/')[0]) || '';
function fmtSize(n){ n=+n; if(!n) return ''; const u=['B','KB','MB','GB']; let i=0; while(n>=1024&&i<u.length-1){n/=1024;i++;} return (i?n.toFixed(1):n)+' '+u[i]; }
function rawFrom(fileUrl){ const m=String(fileUrl||'').match(/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/([^/]+)\//); return m?{o:m[1],r:m[2],b:m[3]}:null; }

async function readmeText(tool){
  const spec = tool.readme || { from:'repo' };
  if(spec.from==='inline') return spec.md || '';
  if(spec.from==='file'){ try{ const r=await fetch(spec.path); return r.ok?await r.text():''; }catch{ return ''; } }
  // repo
  let url = spec.url;
  if(!url && spec.repo){ const p=spec.repo.split('/'); url=`https://raw.githubusercontent.com/${p[0]}/${p[1]}/${p[2]||'main'}/README.md`; }
  if(!url){ const f=(tool.files&&tool.files[0]&&tool.files[0].url)||tool.file; const g=rawFrom(f); if(g) url=`https://raw.githubusercontent.com/${g.o}/${g.r}/${g.b}/README.md`; }
  if(!url) return '';
  try{ const r=await fetch(url); return r.ok?await r.text():''; }catch{ return ''; }
}

async function main(){
  let content;
  try{ content = await (await fetch('/api/content',{cache:'no-store'})).json(); }
  catch{ document.getElementById('tReadme').innerHTML='<p class="state">Could not load site content.</p>'; return; }
  const tool = (content.projects||[]).find(p => p.slug===slug || (p.href||'').replace(/^\/+|\/+$/g,'')===slug);
  if(!tool){ document.getElementById('tTitle').textContent='Not found';
    document.getElementById('tReadme').innerHTML='<p class="state">No tool matches this address.</p>'; return; }

  document.title = tool.title + ' — 802 Universe';
  document.getElementById('tEyebrow').textContent = tool.kind || 'Tool';
  document.getElementById('tTitle').textContent = tool.title || 'Tool';
  document.getElementById('tLede').textContent = tool.desc || '';
  document.getElementById('tTags').innerHTML = (tool.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');

  // download buttons — one per file
  const files = (Array.isArray(tool.files)&&tool.files.length) ? tool.files : (tool.file?[{url:tool.file}]:[]);
  const dl = document.getElementById('tDownloads');
  dl.innerHTML = files.map((f,idx)=>{
    const label = f.label || (f.url||'').split('/').pop() || 'Download';
    return `<a class="btn" href="/download/${encodeURIComponent(slug)}/${idx}" download>`+
           `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>`+
           `${esc(label)} <span class="sz" data-i="${idx}"></span></a>`;
  }).join('') || '<span class="state">No file attached to this tool yet.</span>';

  // sizes via HEAD (progressive; ignore failures)
  files.forEach((f,idx)=>{ fetch(`/download/${encodeURIComponent(slug)}/${idx}`,{method:'HEAD'})
    .then(r=>{ const s=fmtSize(r.headers.get('content-length')); if(s){ const el=dl.querySelector(`.sz[data-i="${idx}"]`); if(el) el.textContent='· '+s; } }).catch(()=>{}); });

  // readme
  const md = await readmeText(tool);
  const box = document.getElementById('tReadme');
  box.innerHTML = md ? mdToHtml(md) : '<p class="readme-empty">No write-up yet.</p>';
}
main();
</script>
</body>
</html>
