<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing on this channel — 802 Universe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231141B8'/><path d='M4 22 L9 22 L11 12 L13 22 L17 22 L19 8 L21 22 L26 22' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Martian+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--paper:#E9EDF2;--ink:#0B1220;--ink-2:#33415A;--muted:#66768D;--cobalt:#1141B8;--grid:rgba(11,18,32,.055)}
@media(prefers-color-scheme:dark){
  :root{--paper:#080B10;--ink:#E4EBF4;--ink-2:#A9B7C9;--muted:#7C8A9E;--cobalt:#6C9BFF;--grid:rgba(228,235,244,.055)}
}
body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;
  background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px}
p.code{font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);margin:0 0 18px}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;letter-spacing:-.04em;line-height:1.02;margin:0 0 14px}
p.sub{color:var(--ink-2);max-width:38ch;margin:0 auto 30px}
a{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-family:'Martian Mono',monospace;
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding:13px 20px;border-radius:9px;
  background:var(--cobalt);color:#fff}
</style>
</head>
<body>
<div>
  <p class="code">404 &middot; No beacon received</p>
  <h1>Nothing on this channel.</h1>
  <p class="sub">The page you asked for isn&rsquo;t here. It may have moved, or the link may have a typo in it.</p>
  <a href="/">Back to 802 Universe</a>
</div>
</body>
</html>
